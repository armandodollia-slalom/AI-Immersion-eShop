name: AgentOps Collect

# Collects pipeline-agent review telemetry (.agent-metrics/*.jsonl lines added by the PR, plus a final
# Architecture Policy Pack review of the PR) into an agentops batch artifact. Runs on untrusted PR code,
# so it has no secrets and a read-only token; "AgentOps Ingest" stores the batch from the default branch.
# See docs/ai-pipeline/agentops.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: agentops-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agentopsdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build AgentOps CLI
        run: dotnet build src/AgentOps.Cli -c Release
      - name: Final policy review of the PR
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pip install --quiet pyyaml
          printf '{"requester":{"agent":"pr-final","task_id":"pr-%s"},"checkpoint":"code_review","base":"%s"}' \
            "${{ github.event.pull_request.number }}" "$BASE_SHA" > policy-request.json
          python architecture-policy/agents/arch_review.py review policy-request.json > policy.json
      - name: Collect agentops batch
        run: >
          dotnet run --project src/AgentOps.Cli -c Release --no-build --
          collect --event "$GITHUB_EVENT_PATH" --policy-review policy.json --out agentops-batch.json
      - name: Preview PR report (ephemeral database)
        env:
          ConnectionStrings__agentopsdb: Host=localhost;Port=5432;Database=agentopsdb;Username=postgres
        run: |
          dotnet run --project src/AgentOps.Cli -c Release --no-build -- ingest --batch agentops-batch.json
          dotnet run --project src/AgentOps.Cli -c Release --no-build -- \
            report pr --number "${{ github.event.pull_request.number }}" --out agentops-report.md
          cat agentops-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agentops-batch
          path: agentops-batch.json
          retention-days: 7

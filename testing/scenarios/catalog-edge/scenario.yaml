          SecurityStamp: ALICESECURITYSTAMP0000000000001
          ConcurrencyStamp: alicesecuritystamp0000000000001
          PhoneNumber: "1234567890"
          PhoneNumberConfirmed: false
          TwoFactorEnabled: false
          LockoutEnabled: true
          AccessFailedCount: 0
          CardHolderName: Alice Smith
          CardNumber: XXXXXXXXXXXX1881
          CardType: 1
          SecurityNumber: "123"
          Expiration: "12/24"
          Name: Alice
          LastName: Smith
          Street: 15703 NE 61st Ct

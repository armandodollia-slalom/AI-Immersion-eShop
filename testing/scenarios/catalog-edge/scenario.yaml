description: >
  Hand-crafted catalog edge cases: 14 "Edge" items (2 pages), a sold-out item, a 50-character name,
  prices 0.01 and 9999.99, an empty description, an unused brand and an unused type. Plus users
  alice, bob and admin (password Pass123$; admin is in role Admin), no orders, empty baskets.
postgres:
  catalogdb:
    - sql: catalog.sql
  identitydb:
    - table: AspNetUsers
      rows:
        - Id: a11ce000-0000-4000-8000-000000000001
          UserName: alice
          NormalizedUserName: ALICE
          Email: AliceSmith@email.com
          NormalizedEmail: ALICESMITH@EMAIL.COM
          EmailConfirmed: true

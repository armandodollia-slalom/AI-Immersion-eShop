description: >
  Default data with low stock (item 11 has 2 units, item 12 has none) plus four past-dated Submitted
  orders for bob that the background pipeline processes within about 30 s of loading. Order 1 (2 x item 9)
  and order 4 (exactly the 2 units of item 11 in stock) reach Paid and decrement stock; order 2 (5 x item 11)
  and order 3 (item 10 plus the out-of-stock item 12) are cancelled by the stock check. alice has no orders.
extends: default
postgres:
  identitydb:
    - table: AspNetUsers
      rows:
        # Administrator: the only role allowed to ship orders (Ordering.API policy OrderingAdmin).
        - Id: ad000000-0000-4000-8000-000000000003
          UserName: admin
          NormalizedUserName: ADMIN
          Email: AdminSmith@email.com
          NormalizedEmail: ADMINSMITH@EMAIL.COM
          EmailConfirmed: true
          PasswordHash: AQAAAAIAAYagAAAAEA8l5zVyTkJ12JxTVsqtD9qlMFT8uoxwjycqv33/PHCbIDfXMczZEJpaTNVfz8CCuA==  # Pass123$
          SecurityStamp: ADMINSECURITYSTAMP000000000003
          ConcurrencyStamp: adminsecuritystamp0000000000003
          PhoneNumber: "1234567890"
          PhoneNumberConfirmed: false
          TwoFactorEnabled: false
          LockoutEnabled: true
          AccessFailedCount: 0
          CardHolderName: Admin Smith
          CardNumber: XXXXXXXXXXXX1881
          CardType: 1
          SecurityNumber: "789"
          Expiration: "12/24"
          Name: Admin
          LastName: Smith
          Street: 15703 NE 61st Ct
          City: Redmond
          State: WA
          Country: U.S.
          ZipCode: "98052"
    - table: AspNetRoles
      rows:
        # The role that Ordering.API's OrderingAdmin policy requires for ship.
        - Id: ad0e0000-0000-4000-8000-0000000000a1
          Name: Admin
          NormalizedName: ADMIN
          ConcurrencyStamp: adminrole0000000000000000000001
    - table: AspNetUserRoles
      rows:
        - UserId: ad000000-0000-4000-8000-000000000003
          RoleId: ad0e0000-0000-4000-8000-0000000000a1
  catalogdb:
    - sql: catalog-stock.sql
  orderingdb:
    - table: ordering.buyers
      rows:
        - { Id: 1, IdentityGuid: b0b00000-0000-4000-8000-000000000002, Name: bob }
    - table: ordering.paymentmethods
      rows:
        - { Id: 1, BuyerId: 1, CardTypeId: 2, Alias: Bob Visa, CardHolderName: Bob Smith, CardNumber: XXXXXXXXXXXX1881, Expiration: 2030-12-31T00:00:00Z }
    - table: ordering.orders
      rows:
        - { Id: 1, BuyerId: 1, PaymentMethodId: 1, OrderDate: 2025-07-01T09:00:00Z, OrderStatus: Submitted, Description: null, Address_Street: 2 Bob Road, Address_City: Portland, Address_State: OR, Address_Country: U.S., Address_ZipCode: "97201" }
        - { Id: 2, BuyerId: 1, PaymentMethodId: 1, OrderDate: 2025-07-02T09:00:00Z, OrderStatus: Submitted, Description: null, Address_Street: 2 Bob Road, Address_City: Portland, Address_State: OR, Address_Country: U.S., Address_ZipCode: "97201" }
        - { Id: 3, BuyerId: 1, PaymentMethodId: 1, OrderDate: 2025-07-03T09:00:00Z, OrderStatus: Submitted, Description: null, Address_Street: 2 Bob Road, Address_City: Portland, Address_State: OR, Address_Country: U.S., Address_ZipCode: "97201" }
        - { Id: 4, BuyerId: 1, PaymentMethodId: 1, OrderDate: 2025-07-04T09:00:00Z, OrderStatus: Submitted, Description: null, Address_Street: 2 Bob Road, Address_City: Portland, Address_State: OR, Address_Country: U.S., Address_ZipCode: "97201" }
    - table: ordering.orderItems
      rows:
        # 1: 2 x 199.99 = 399.98   2: 5 x 129.99 = 649.95   3: 59.99 + 399.00 = 458.99   4: 2 x 129.99 = 259.98
        - { Id: 1, OrderId: 1, ProductId: 9, ProductName: VenturePro GPS Watch, UnitPrice: 199.99, Discount: 0, Units: 2, PictureUrl: null }
        - { Id: 2, OrderId: 2, ProductId: 11, ProductName: Vertical Journey Climbing Shoes, UnitPrice: 129.99, Discount: 0, Units: 5, PictureUrl: null }
        - { Id: 3, OrderId: 3, ProductId: 10, ProductName: Trailblazer Bike Helmet, UnitPrice: 59.99, Discount: 0, Units: 1, PictureUrl: null }
        - { Id: 4, OrderId: 3, ProductId: 12, ProductName: Powder Pro Snowboard, UnitPrice: 399.00, Discount: 0, Units: 1, PictureUrl: null }
        - { Id: 5, OrderId: 4, ProductId: 11, ProductName: Vertical Journey Climbing Shoes, UnitPrice: 129.99, Discount: 0, Units: 2, PictureUrl: null }

description: >
  Default data plus one Redis basket for BUG-8 (Basket.API quantity validation). alice has no
  basket (invalid updates must not create one); bob has two items (3 units) that an invalid
  update must leave untouched.
extends: default
redis:
  # bob: products 7 x2 and 6 x1. TC-BUG-8-06 sends a mixed valid/invalid update and expects this value unchanged.
  - key: /basket/b0b00000-0000-4000-8000-000000000002
    json:
      BuyerId: b0b00000-0000-4000-8000-000000000002
      Items:
        - { Id: 0d8a8a3f-9a8e-4d55-9c4f-000000000031, ProductId: 7, ProductName: Explorer 45L Backpack, UnitPrice: 149.99, OldUnitPrice: 0, Quantity: 2, PictureUrl: "" }
        - { Id: 0d8a8a3f-9a8e-4d55-9c4f-000000000032, ProductId: 6, ProductName: Carbon Fiber Trekking Poles, UnitPrice: 69.99, OldUnitPrice: 0, Quantity: 1, PictureUrl: "" }
